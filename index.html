<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="overlay"></div>
  <main class="card">
    <div class="card-image" role="img" aria-label="Makkah"></div>

    <form class="card-form" action="#" method="post">
      <h1>Get Umrah Quote</h1>
      <p class="subtitle">All-Inclusive Umrah Package</p>

      <label for="name">Lead Passenger Name:</label>
      <input type="text" id="name" name="name" placeholder="Mohammad Ali" required>

      <label for="phone">Enter Active Number:</label>
      <input type="tel" id="phone" name="phone" placeholder="+44 203 123 4567" required>

      <label for="email">Enter Email:</label>
      <input type="email" id="email" name="email" placeholder="myemail@gmail.com" required>

      <label for="passengers">Total Passengers:</label>
      <input type="text" id="passengers" name="passengers" placeholder="i.e 2 adults &amp; 2 kid" required>

      <div class="privacy">
        <span>I accept the <a href="#">Privacy Policy</a></span>
        <input type="checkbox" name="privacy" required>
      </div>

      <button type="submit">Submit</button>
    </form>
  </main>
</body>
</html>
